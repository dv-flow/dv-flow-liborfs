name: CI

# CONVERTED 2026-08-31 (github-coexistence-completion-plan.md Phase 6, wave 2).
#
# This is the one PyPI publisher in dv-flow that does NOT route through the
# shared dv-flow-release workflow -- it carries its own inline copy of the same
# logic, and therefore did not inherit the tag gate that landed there. It had
# both of the org's publishing problems at once:
#
#   - name: Publish to PyPi
#     if: ${{ startsWith(github.ref, 'refs/heads/main') || ... }}
#         a push to main published to PyPI
#
#   - name: Publish Docs
#     uses: JamesIves/github-pages-deploy-action@4.1.7
#         NO condition at all -- every branch, every pull request, force-wrote
#         the gh-pages branch
#
# dv-flow is now in a 5-minute bidirectional mirror, so a push to `main` can
# originate from a sync cycle. A mirror operation must never be a publish
# operation.
#
# Its counterpart is .forgejo/workflows/ci.yml. Both must exist: with
# .forgejo/workflows/ absent the Forgejo runner falls back to running THIS file.

on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

jobs:
  gate:
    # Release master switch. ONE file, above both platforms, decides who
    # releases this repo:
    #   https://dvkit.org/.well-known/release-authority.json
    # Generated from sync-policy.toml by `git-sync emit-release-authority`, so
    # GitHub and Forgejo cannot drift -- there is only one copy for them to
    # disagree about. The runner only READS it, over plain HTTPS with no
    # credential: a workflow file is public and editable by anyone who can push.
    #
    # `if:` on a job cannot reference a step in its own job, so the switch is
    # resolved here and consumed through needs.gate.outputs.authority -- which
    # requires `needs: gate` on the consuming job, declared below. Omit it and
    # the expression is an empty string: nothing publishes, and nothing goes red.
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # One line on purpose: a multi-line `python3 -c` has to start at column
        # 0, which terminates the YAML block scalar and silently corrupts the
        # workflow.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # DECIDED 2026-08-30: fail CLOSED on a tag. A release blocked by a
            # dvkit.org outage is recoverable; a release published twice from
            # two forges is not, and a PyPI version can be yanked but never
            # reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci:
    needs: gate
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Fetch dependencies
      shell: bash
      run: |
        python3 -m venv py
        ./py/bin/pip install --upgrade --pre ivpm
        ./py/bin/ivpm update -a -d default-dev
        ./packages/python/bin/pip install -U typing_extensions build

    - name: Install packages
      shell: bash
      run: |
        ./packages/python/bin/pip install -e packages/dv-flow-liborfs
        ./packages/python/bin/pip install -e packages/dv-flow-liborfs-nangate45

    - name: Update Version
      shell: bash
      working-directory: packages/dv-flow-liborfs
      run: |
        tag=$(git tag -l --contains HEAD)
        echo "tag: ${tag}"
        version=$(grep -w version pyproject.toml | sed -e 's%^.*=.*"\([^"][^"]*\)".*$%\1%')
        if test -z ${tag}; then
            # NOT a release. The suffix is a PEP 440 LOCAL VERSION SEGMENT --
            # the part after the '+' -- and PyPI rejects any upload carrying
            # one, outright, at the tool. It used to be a bare run id, giving
            # 0.0.1<run-id>: a perfectly valid and perfectly uploadable version.
            # The tag gate below is the control; this is the backstop for the
            # day someone edits the gate.
            echo "Configuring a development build (not publishable)"
            suffix=".dev${{ github.run_id }}+gh"
        else
            suffix=""
        fi
        sed -i -e "s%SUFFIX=\".*\"%SUFFIX=\"${suffix}\"%g" \
               -e "s%VERSION=\".*\"%VERSION=\"${version}\"%g" \
             src/dv_flow/liborfs/__init__.py
        sed -i -e "s%version.*=.*\".*\"%version = \"${version}${suffix}\"%g" \
               pyproject.toml
        echo "building version ${version}${suffix}"

    - name: Run tests
      shell: bash
      working-directory: packages/dv-flow-liborfs
      run: |
        export PYTHONPATH=$(pwd)/src:$PYTHONPATH
        ../../packages/python/bin/python -m build -n .
        ../../packages/python/bin/pytest tests

    - name: Build packages
      shell: bash
      working-directory: packages/dv-flow-liborfs
      run: |
        ../../packages/python/bin/python -m build .

    - name: Build Docs
      # KEPT as a CI check -- see the note below on what left.
      shell: bash
      working-directory: packages/dv-flow-liborfs/docs
      run: |
        make html
        touch _build/html/.nojekyll

    # `Publish Docs` WAS HERE and is deliberately gone.
    #
    #   - name: Publish Docs
    #     uses: JamesIves/github-pages-deploy-action@4.1.7
    #     with: { branch: gh-pages, folder: .../docs/_build/html }
    #
    # It had no ref condition whatsoever. dvkit.org owns all documentation now,
    # and deleting rather than tag-gating is the runbook's own instruction: a
    # tag-gated gh-pages deploy is still a second publisher of the same content
    # on a different schedule.
    #
    # This repo has no GitHub Pages SITE configured (checked via the Pages API,
    # 404), so unlike twelve of its siblings the gh-pages branch here was being
    # written and never served.

    - name: Publish to PyPi
      # A TAG, and the switch naming THIS forge. A push to a branch never
      # releases anything -- that is what makes the 5-minute mirror safe.
      #
      # SKIPS, does not fail, when the switch names Forgejo.
      if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not visible to this repository"
          exit 1
        fi
        ./py/bin/python3 -m pip install -U twine packaging
        ./py/bin/python3 -m twine check packages/dv-flow-liborfs/dist/*.whl
        # Idempotence net: with one switch and two possible publishers, a
        # double-fire must be a no-op rather than a hard failure on
        # "File already exists".
        ./py/bin/python3 -m twine upload --non-interactive --skip-existing \
          packages/dv-flow-liborfs/dist/*.whl
