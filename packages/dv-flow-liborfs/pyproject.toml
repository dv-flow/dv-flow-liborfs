[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-flow-liborfs"
version = "0.0.1"
dependencies = ["dv-flow-mgr"]
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
description = "DV Flow tasks for the OpenROAD RTL-to-GDS flow (ORFS)"
license = {file = "LICENSE"}

[project.entry-points."dv_flow.mgr"]
liborfs = "dv_flow.liborfs.__ext__"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"dv_flow.liborfs" = ["**/flow.dv", "share/**/*"]

[tool.setuptools.cmdclass]
build_py = "build_orfs_scripts.BuildPy"
sdist    = "build_orfs_scripts.Sdist"
