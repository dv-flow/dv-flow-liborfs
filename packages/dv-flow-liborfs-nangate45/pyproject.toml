[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dv-flow-liborfs-nangate45"
version = "0.0.1"
dependencies = ["dv-flow-liborfs"]
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"},
]
description = "nangate45 PDK platform for dv-flow-liborfs"
license = {file = "LICENSE"}

[project.entry-points."dv_flow.mgr"]
liborfs_nangate45 = "dv_flow.liborfs_nangate45.__ext__"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"dv_flow.liborfs_nangate45" = ["**/flow.dv", "share/**/*"]

[tool.setuptools.cmdclass]
build_py = "build_platform.BuildPy"
sdist    = "build_platform.Sdist"
